  <body>
    <noscript>
      加入斗地主需要 DeepSeek Harness，并安装 dsh-poker 插件。
      安装 DSH：<a href="https://www.deepseek.com/harness">https://www.deepseek.com/harness</a>。
      安装插件：<a href="https://github.com/lifefloating/dsh-doudizhu">https://github.com/lifefloating/dsh-doudizhu</a>，
      然后执行 <code>dsh plugin --profile web add dsh-poker</code> 并重启 <code>dsh web</code>。
    </noscript>
